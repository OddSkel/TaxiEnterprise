<div class="container">
  <h2>Pedir Viagem</h2>

  <form (ngSubmit)="pedirViagem()" class="viagem-form">
    <h3>Dados do Cliente</h3>
    <label>
      Nome:
      <input type="text" [(ngModel)]="cliente.pessoa.nome" name="nome" placeholder="Nome completo" required />
    </label>

    <label>
      NIF:
      <input type="text" [(ngModel)]="cliente.pessoa.nif" name="nif" placeholder="NIF" required />
    </label>

    <label>
      Género:
      <select [(ngModel)]="cliente.pessoa.genero" name="genero" required>
        <option value="">Selecione o género</option>
        <option value="masculino">Masculino</option>
        <option value="feminino">Feminino</option>
      </select>
    </label>

    <h3>Informações da Viagem</h3>
    <label>
      Origem:
      <input type="text" [(ngModel)]="origem" name="origem" placeholder="Rua ou coordenadas (lat, lon)" required />
    </label>
    <button type="button" (click)="usarLocalizacaoAtual()">📍 Usar Localização Atual</button>

    <label>
      Destino:
      <input type="text" [(ngModel)]="destino" name="destino" placeholder="Rua ou coordenadas (lat, lon)" required />
    </label>

    <label>
      Conforto:
      <select [(ngModel)]="conforto" name="conforto" required>
        <option value="">Selecione o tipo de conforto</option>
        <option value="BASICO">BASICO</option>
        <option value="LUXUOSO">LUXUOSO</option>
      </select>
    </label>

    <label>
      Nº de Pessoas:
      <input type="number" [(ngModel)]="numPessoas" name="numPessoas" min="1" max="8" required />
    </label>

    <button type="submit" class="btn-pedir">🚕 Pedir Viagem</button>
  </form>

  <div id="map"></div>
</div>
