<div class="register-container">
  <h2>Registar Novo Táxi</h2>

  <form (ngSubmit)="add()" *ngIf="taxi">
    <!-- Matrícula -->
    <div class="form-group">
      <label for="matricula">Matrícula</label>
      <input
        type="text"
        id="matricula"
        [(ngModel)]="taxi.matricula"
        name="matricula"
        (blur)="validateMatricula()"
        [class.invalid]="fieldErrors['matricula']"
      />
      <div class="error" *ngIf="fieldErrors['matricula']">
        {{ fieldErrors['matricula'] }}
      </div>
    </div>

    <!-- Ano de Compra -->
    <div class="form-group">
      <label for="ano">Ano de Compra</label>
      <input
        type="number"
        id="ano"
        [(ngModel)]="taxi.ano_compra"
        name="ano_compra"
        (blur)="validateAnos()"
        [class.invalid]="fieldErrors['ano_compra']"
      />
      <div class="error" *ngIf="fieldErrors['ano_compra']">
        {{ fieldErrors['ano_compra'] }}
      </div>
    </div>

    <!-- Marca -->
    <div class="form-group">
      <label for="marca">Marca</label>
      <input
        type="text"
        id="marca"
        [(ngModel)]="taxi.marca"
        name="marca"
        (blur)="validateMarca()"
        [class.invalid]="fieldErrors['marca']"
      />
      <div class="error" *ngIf="fieldErrors['marca']">
        {{ fieldErrors['marca'] }}
      </div>
    </div>

    <!-- Modelo -->
    <div class="form-group">
      <label for="modelo">Modelo</label>
      <input
        type="text"
        id="modelo"
        [(ngModel)]="taxi.modelo"
        name="modelo"
        (blur)="validateModelo()"
        [class.invalid]="fieldErrors['modelo']"
      />
      <div class="error" *ngIf="fieldErrors['modelo']">
        {{ fieldErrors['modelo'] }}
      </div>
    </div>

    <!-- Nível de Conforto -->
    <div class="form-group">
      <label for="nivel_conforto">Nível de Conforto</label>
      <select
        id="nivel_conforto"
        [(ngModel)]="taxi.nivel_conforto"
        name="nivel_conforto"
        (blur)="validateConforto()"
        [class.invalid]="fieldErrors['nivel_conforto']"
      >
        <option value="">Selecione...</option>
        <option value="BASICO">BASICO</option>
        <option value="LUXUOSO">LUXUOSO</option>
      </select>
      <div class="error" *ngIf="fieldErrors['nivel_conforto']">
        {{ fieldErrors['nivel_conforto'] }}
      </div>
    </div>

    <!-- Botões -->
    <div class="button-group">
      <button type="submit" [disabled]="!formValid">Adicionar Táxi</button>
      <button type="button" class="secondary" (click)="clearForm()">Limpar</button>
      <button type="button" class="secondary" (click)="goBack()">Voltar</button>
    </div>

    <!-- Erro geral -->
    <div class="error general-error" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>
  </form>
</div>
