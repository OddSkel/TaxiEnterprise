<div id="search-component">
  <label for="search-box">Taxi Search</label>
  <input #searchBox id="search-box" (input)="search(searchBox.value)" />

  <ul class="search-result">
    <li *ngFor="let taxi of taxis$ | async">
      <a routerLink="/detail/{{ taxi.id }}">
        {{ taxi.matricula }}
      </a>
    </li>
  </ul>
</div>
