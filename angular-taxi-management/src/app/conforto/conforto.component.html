<h2>Estes são os niveis de conforto!</h2>

<ul *ngFor="let conforto of confortos">
  <li>Tipo de conforto: {{ conforto.name }}</li>
  <li>Preço por minuto: {{ conforto.preco }}</li>
  <li>
    Acrescimo:
    {{ getAcrescimoPercent(conforto.acrescimo) | percent : "1.0-2" }}
  </li>
  <li>
    <a routerLink="/confortos/{{ conforto.name }}"> Editar </a>
    <a routerLink="/confortos/simular/{{ conforto.name }}"> Simular </a>
  </li>
</ul>
