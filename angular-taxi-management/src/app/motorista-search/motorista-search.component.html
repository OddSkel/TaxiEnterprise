<div id="search-component">
  <label for="search-box">Procura de Motorista</label>
  <input
    #searchBox
    id="search-box"
    (input)="search(searchBox.value)"
    (focus)="onSearchBoxFocus()"
    placeholder="Digite o NIF"
  />

  <ul class="search-result">
    <li *ngFor="let motorista of motoristas$ | async">
      <button
        (click)="goToMotoristaDetails(motorista)"
        class="search-result-button"
      >
        {{ motorista.pessoa.nif }}
      </button>
    </li>
  </ul>

  <p *ngIf="notFound" class="not-found">Nenhum motorista encontrado.</p>
</div>
